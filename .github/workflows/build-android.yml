name: Build Android RustDesk

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: rustdesk

    env:
      RUST_VERSION: "1.75"
      FLUTTER_VERSION: "3.24.5"
      CARGO_NDK_VERSION: "3.1.2"
      NDK_VERSION: "r28c"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc-multilib \
            g++ \
            g++-multilib \
            git \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libc6-dev \
            libclang-dev \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev \
            libpulse-dev \
            libva-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxfixes-dev \
            llvm-dev \
            nasm \
            ninja-build \
            openjdk-17-jdk-headless \
            pkg-config \
            tree \
            wget

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"
          targets: aarch64-linux-android
          components: rustfmt

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --version 3.1.2 --locked

      - name: Fetch Flutter packages
        run: |
          cd flutter
          flutter pub get

      - name: Build RustDesk ARM64 library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add aarch64-linux-android
          chmod +x ./flutter/ndk_arm64.sh
          ./flutter/ndk_arm64.sh

          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a

          cp ./target/aarch64-linux-android/release/liblibrustdesk.so \
             ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so

          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             ./flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Android APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH

          sed -i "s/signingConfigs.release/signingConfigs.debug/g" \
            ./flutter/android/app/build.gradle

          cd flutter

          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --split-per-abi

      - name: Collect APK
        run: |
          mkdir -p ../android-output

          cp ./flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             ../android-output/WillyGenius-Remote-Support-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: WillyGenius-Remote-Support-Android
          path: android-output/WillyGenius-Remote-Support-Android.apk